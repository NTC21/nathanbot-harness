<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nathanbot</title>
    <script>
      // Pre-paint: honor the stored choice first (no FOUC); only follow the OS
      // when the user hasn't explicitly picked a theme.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("nathanbot-theme"); } catch (e) {}
        var dark = stored
          ? stored === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        if (!stored) {
          window.matchMedia("(prefers-color-scheme: dark)").addEventListener(
            "change",
            function (e) { document.documentElement.classList.toggle("dark", e.matches); }
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
